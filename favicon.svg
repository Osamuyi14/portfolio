<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#f2b705"/>
      <stop offset="55%" stop-color="#ffd75e"/>
      <stop offset="100%" stop-color="#4fd1c5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0a0f1c"/>
  <rect width="64" height="64" rx="15" fill="none" stroke="#1c2c47" stroke-width="1"/>
  <!-- italic-slanted ring, echoing the "O" in the wordmark -->
  <g transform="translate(32,33) rotate(-11)">
    <ellipse cx="0" cy="0" rx="15" ry="18" fill="none" stroke="url(#g)" stroke-width="7"/>
  </g>
  <!-- brand dot, echoes the eyebrow marker used across the site -->
  <rect x="45" y="45" width="6" height="6" fill="#4fd1c5"/>
</svg>
